<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>单词消消乐 · 四级词汇 · 限时挑战</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }

    body {
      background: linear-gradient(145deg, #eef3fa 0%, #dce6f0 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      margin: 0;
      overflow-x: hidden;
    }

    .app-card {
      max-width: 680px;
      width: 100%;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 2rem;
      box-shadow: 0 25px 50px -15px rgba(0, 20, 40, 0.35),
                  inset 0 1px 3px rgba(255, 255, 255, 0.9);
      padding: 1.4rem 1.3rem;
      border: 1px solid rgba(255, 255, 255, 0.7);
      transition: transform 0.05s ease;
    }

    /* ===== 顶部 ===== */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      gap: 0.6rem;
    }

    .timer-box {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: linear-gradient(135deg, #1f3a5f 0%, #2a4a73 100%);
      color: white;
      padding: 0.6rem 1.2rem;
      border-radius: 60px;
      box-shadow: 0 6px 16px -6px #1f3a5f90;
      transition: all 0.3s ease;
    }

    .timer-box.warning {
      background: linear-gradient(135deg, #e06b2b 0%, #d35400 100%);
      animation: timerPulse 0.8s ease infinite alternate;
    }

    .timer-box.danger {
      background: linear-gradient(135deg, #d9534f 0%, #b13e3e 100%);
      animation: timerPulse 0.4s ease infinite alternate;
    }

    @keyframes timerPulse {
      from { transform: scale(1); box-shadow: 0 6px 16px -6px rgba(200, 50, 50, 0.6); }
      to { transform: scale(1.05); box-shadow: 0 8px 22px -6px rgba(200, 50, 50, 0.9); }
    }

    .timer-icon { font-size: 1.3rem; }

    .timer-value {
      font-size: 1.6rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: 1px;
      line-height: 1;
    }

    .timer-label {
      font-size: 0.7rem;
      opacity: 0.8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .score-box {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(255, 255, 255, 0.7);
      padding: 0.4rem 0.9rem;
      border-radius: 1rem;
      min-width: 60px;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.03), 0 2px 6px -3px rgba(0,0,0,0.08);
    }

    .stat-value {
      font-size: 1.2rem;
      font-weight: 700;
      color: #1f3a5f;
      line-height: 1.2;
    }

    .stat-label {
      font-size: 0.65rem;
      color: #6d8aa8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 500;
    }

    /* ===== 关卡选择 ===== */
    .level-bar {
      display: flex;
      gap: 0.4rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
    }

    .level-btn {
      padding: 0.45rem 1rem;
      border-radius: 60px;
      border: 1px solid #d0ddeb;
      background: #ffffffd9;
      font-size: 0.85rem;
      font-weight: 500;
      color: #1f3a5f;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .level-btn:hover {
      background: #e8f0fe;
      transform: translateY(-2px);
    }

    .level-btn.active {
      background: #1f3a5f;
      color: white;
      border-color: #1f3a5f;
      box-shadow: 0 6px 16px -6px #1f3a5f90;
    }

    /* ===== 游戏区域 ===== */
    .game-board {
      display: grid;
      gap: 0.45rem;
      margin: 0 auto 0.8rem;
      justify-content: center;
      max-width: 520px;
      position: relative;
      min-height: 200px;
    }

    .game-board.grid-4 {
      grid-template-columns: repeat(4, 1fr);
    }

    /* ===== 待机遮罩（开始游戏按钮） ===== */
    .start-overlay {
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(4px);
      border-radius: 1.2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
      gap: 1rem;
      opacity: 1;
      transition: opacity 0.3s ease;
    }

    .start-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .start-overlay .start-icon {
      font-size: 3.5rem;
      animation: floatIcon 2s ease-in-out infinite;
    }

    @keyframes floatIcon {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .start-overlay p {
      font-size: 1rem;
      color: #4b6a88;
      font-weight: 500;
      text-align: center;
      padding: 0 1rem;
    }

    .btn-start {
      border: none;
      padding: 1rem 2.6rem;
      border-radius: 60px;
      font-size: 1.15rem;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(135deg, #1f3a5f 0%, #2a4a73 100%);
      color: white;
      box-shadow: 0 12px 28px -10px #1f3a5f;
      transition: all 0.2s ease;
      letter-spacing: 1px;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
    }

    .btn-start:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 18px 36px -12px #1f3a5f;
      background: linear-gradient(135deg, #254a70 0%, #2f5a8a 100%);
    }

    .btn-start:active {
      transform: translateY(1px) scale(0.98);
    }

    /* ===== 卡片 ===== */
    .card {
      aspect-ratio: 1;
      border-radius: 0.9rem;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.2rem;
      text-align: center;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
      position: relative;
      overflow: hidden;
      word-break: break-word;
      line-height: 1.15;
      border: 2px solid transparent;
      min-height: 0;
    }

    .card.card-en {
      background: linear-gradient(135deg, #ffffff 0%, #e8f0fe 100%);
      color: #1f3a5f;
      border-color: #c3d6ef;
      box-shadow: 0 4px 10px -5px rgba(30, 70, 120, 0.2);
      font-size: 1.05rem;
      letter-spacing: -0.02em;
    }

    .card.card-cn {
      background: linear-gradient(135deg, #fff8e8 0%, #ffefd5 100%);
      color: #7a5b1a;
      border-color: #f0d9a8;
      box-shadow: 0 4px 10px -5px rgba(120, 90, 20, 0.2);
      font-size: 0.92rem;
    }

    .card:hover:not(.matched):not(.selected) {
      transform: translateY(-3px) scale(1.04);
      box-shadow: 0 10px 20px -8px rgba(30, 70, 120, 0.35);
      border-color: #8aafd4;
    }

    .card.selected {
      transform: scale(1.07);
      border-color: #4a90e2;
      box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.3), 0 10px 20px -8px rgba(30, 70, 120, 0.4);
      animation: pulse 0.6s ease infinite alternate;
    }

    @keyframes pulse {
      from { box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.3), 0 10px 20px -8px rgba(30, 70, 120, 0.4); }
      to { box-shadow: 0 0 0 6px rgba(74, 144, 226, 0.15), 0 10px 20px -8px rgba(30, 70, 120, 0.4); }
    }

    .card.matched {
      background: linear-gradient(135deg, #d4f5d4 0%, #b8ecc0 100%);
      border-color: #7ec87e;
      color: #2e7d32;
      cursor: default;
      animation: matchPop 0.4s ease;
      opacity: 0.65;
    }

    @keyframes matchPop {
      0% { transform: scale(1); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    .card.wrong {
      animation: wrongShake 0.4s ease;
      border-color: #e06b6b;
      background: linear-gradient(135deg, #ffe0e0 0%, #ffd0d0 100%);
    }

    @keyframes wrongShake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    .card.matched::after {
      content: "✓";
      position: absolute;
      top: 4px;
      right: 6px;
      font-size: 0.8rem;
      color: #4caf50;
      font-weight: bold;
    }

    /* ===== 控制区 ===== */
    .controls {
      display: flex;
      gap: 0.6rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 0.6rem;
    }

    .btn {
      border: none;
      padding: 0.6rem 1.3rem;
      border-radius: 60px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      transition: all 0.2s ease;
      border: 1px solid rgba(255,255,255,0.7);
    }

    .btn-primary {
      background: #1f3a5f;
      color: white;
      box-shadow: 0 8px 18px -8px #1f3a5f90;
      border-color: #2a4a73;
    }

    .btn-primary:hover { background: #254a70; transform: translateY(-2px); }
    .btn-secondary {
      background: #ffffffd9;
      color: #1f3a5f;
      box-shadow: 0 6px 12px -6px rgba(0, 20, 40, 0.15);
    }
    .btn-secondary:hover { background: #ffffff; transform: translateY(-2px); }
    .btn:active { transform: translateY(1px); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none !important; }

    /* ===== 消息 ===== */
    .message {
      text-align: center;
      font-size: 0.92rem;
      padding: 0.6rem 1rem;
      border-radius: 2rem;
      color: #406080;
      background: rgba(255, 255, 255, 0.7);
      margin-top: 0.4rem;
      font-weight: 500;
      min-height: 2.4rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .message.success { color: #2e7d32; background: #e8f5e9; }
    .message.error { color: #b13e3e; background: #ffeaea; }

    /* ===== 单词提示条 ===== */
    .word-hint {
      text-align: center;
      font-size: 0.75rem;
      color: #6d8aa8;
      margin-bottom: 0.5rem;
      min-height: 1.2rem;
      line-height: 1.4;
    }

    /* ============================================================
       震动动画
       ============================================================ */

    /* 答对：中等强度震动 */
    @keyframes shakeCorrect {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      10% { transform: translate(-8px, -6px) rotate(-0.8deg); }
      20% { transform: translate(8px, 5px) rotate(0.8deg); }
      30% { transform: translate(-7px, 6px) rotate(-0.7deg); }
      40% { transform: translate(7px, -5px) rotate(0.7deg); }
      50% { transform: translate(-6px, 4px) rotate(-0.5deg); }
      60% { transform: translate(6px, -4px) rotate(0.5deg); }
      70% { transform: translate(-4px, 3px) rotate(-0.3deg); }
      80% { transform: translate(4px, -3px) rotate(0.3deg); }
      90% { transform: translate(-2px, 1px) rotate(-0.2deg); }
    }

    .app-card.shake-correct {
      animation: shakeCorrect 0.6s ease;
    }

    /* 答错：超强震动（幅度更大、频率更高、带旋转） */
    @keyframes shakeWrong {
      0%, 100% { transform: translate(0, 0) rotate(0deg) scale(1); }
      5%  { transform: translate(-22px, -16px) rotate(-2.5deg) scale(1.01); }
      10% { transform: translate(22px, 14px) rotate(2.5deg) scale(1.02); }
      15% { transform: translate(-20px, 16px) rotate(-2.2deg) scale(1.01); }
      20% { transform: translate(20px, -14px) rotate(2.2deg) scale(1.02); }
      25% { transform: translate(-18px, 12px) rotate(-2deg) scale(1.01); }
      30% { transform: translate(18px, -12px) rotate(2deg) scale(1.02); }
      35% { transform: translate(-16px, 10px) rotate(-1.8deg) scale(1.01); }
      40% { transform: translate(16px, -10px) rotate(1.8deg) scale(1.02); }
      45% { transform: translate(-14px, 8px) rotate(-1.5deg) scale(1.01); }
      50% { transform: translate(14px, -8px) rotate(1.5deg) scale(1.02); }
      55% { transform: translate(-12px, 6px) rotate(-1.2deg) scale(1.01); }
      60% { transform: translate(12px, -6px) rotate(1.2deg) scale(1.01); }
      65% { transform: translate(-10px, 5px) rotate(-1deg) scale(1.01); }
      70% { transform: translate(10px, -5px) rotate(1deg) scale(1.01); }
      75% { transform: translate(-8px, 4px) rotate(-0.8deg) scale(1.01); }
      80% { transform: translate(8px, -4px) rotate(0.8deg) scale(1.01); }
      85% { transform: translate(-6px, 3px) rotate(-0.6deg) scale(1); }
      90% { transform: translate(6px, -3px) rotate(0.6deg) scale(1); }
      95% { transform: translate(-3px, 1px) rotate(-0.3deg) scale(1); }
    }

    .app-card.shake-wrong {
      animation: shakeWrong 0.9s cubic-bezier(0.36, 0.07, 0.19, 0.97);
    }

    /* ===== 炸弹掉落层 ===== */
    .bomb-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s ease;
    }

    .bomb-overlay.show {
      opacity: 1;
    }

    .bomb {
      font-size: 7rem;
      animation: bombDrop 0.9s cubic-bezier(0.55, 0.06, 0.68, 0.19) forwards;
      filter: drop-shadow(0 0 25px rgba(255, 60, 0, 0.9));
      transform-origin: center center;
    }

    @keyframes bombDrop {
      0% {
        transform: translateY(-120vh) scale(0.5) rotate(-30deg);
        opacity: 0;
      }
      15% { opacity: 1; }
      55% {
        transform: translateY(0) scale(1.15) rotate(10deg);
        opacity: 1;
      }
      65% {
        transform: translateY(-20px) scale(1.05) rotate(-5deg);
        opacity: 1;
      }
      78% {
        transform: translateY(0) scale(1.2) rotate(3deg);
        opacity: 1;
      }
      100% {
        transform: translateY(60vh) scale(0.6) rotate(25deg);
        opacity: 0;
      }
    }

    .impact-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: rgba(255, 100, 0, 0.6);
      transform: translate(-50%, -50%) scale(0);
      opacity: 0;
    }

    .bomb-overlay.show .impact-ring {
      animation: impactExpand 0.7s ease-out 0.45s forwards;
    }

    @keyframes impactExpand {
      0% {
        transform: translate(-50%, -50%) scale(0);
        opacity: 0.9;
      }
      100% {
        transform: translate(-50%, -50%) scale(15);
        opacity: 0;
      }
    }

    /* ===== 答对：屏幕中央对号 ===== */
    .check-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 180;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s ease;
    }

    .check-overlay.show {
      opacity: 1;
    }

    .check-mark {
      font-size: 12rem;
      font-weight: 700;
      color: #4caf50;
      text-shadow: 0 0 40px rgba(76, 175, 80, 0.9),
                   0 0 80px rgba(76, 175, 80, 0.6);
      animation: checkPop 0.75s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      line-height: 1;
    }

    @keyframes checkPop {
      0% {
        transform: scale(0) rotate(-30deg);
        opacity: 0;
      }
      30% {
        transform: scale(1.4) rotate(10deg);
        opacity: 1;
      }
      50% {
        transform: scale(1) rotate(-5deg);
        opacity: 1;
      }
      70% {
        transform: scale(1.15) rotate(3deg);
        opacity: 1;
      }
      100% {
        transform: scale(1.3) rotate(0deg);
        opacity: 0;
      }
    }

    /* ===== 结算弹窗 ===== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 25, 45, 0.55);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      padding: 1rem;
    }

    .modal-overlay.show {
      opacity: 1;
      pointer-events: all;
    }

    .modal {
      background: #ffffff;
      border-radius: 2.2rem;
      padding: 2rem 1.8rem;
      text-align: center;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 30px 60px -20px rgba(0, 20, 40, 0.4);
      transform: scale(0.85);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .modal-overlay.show .modal { transform: scale(1); }

    .modal-icon {
      font-size: 4rem;
      margin-bottom: 0.4rem;
      animation: bounce 0.6s ease;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      40% { transform: translateY(-18px); }
      60% { transform: translateY(-8px); }
    }

    .modal h2 {
      font-size: 1.7rem;
      color: #1f3a5f;
      margin-bottom: 0.4rem;
    }

    .modal.success h2 { color: #2e7d32; }
    .modal.fail h2 { color: #b13e3e; }

    .modal p {
      color: #54708f;
      font-size: 0.95rem;
      margin-bottom: 1.3rem;
      line-height: 1.5;
    }

    .modal-stats {
      display: flex;
      justify-content: center;
      gap: 1.3rem;
      margin-bottom: 1.5rem;
    }

    .modal-stat {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .modal-stat-value {
      font-size: 1.5rem;
      font-weight: 700;
      color: #1f3a5f;
    }

    .modal-stat-label {
      font-size: 0.75rem;
      color: #6d8aa8;
    }

    /* ===== 响应式 ===== */
    @media (max-width: 600px) {
      .app-card { padding: 1rem; border-radius: 1.5rem; }
      .timer-value { font-size: 1.3rem; }
      .timer-box { padding: 0.5rem 0.9rem; }
      .card { font-size: 0.9rem; border-radius: 0.75rem; }
      .card.card-en { font-size: 0.95rem; }
      .card.card-cn { font-size: 0.82rem; }
      .game-board { gap: 0.35rem; max-width: 100%; }
      .level-btn { padding: 0.4rem 0.8rem; font-size: 0.78rem; }
      .btn { padding: 0.55rem 1.1rem; font-size: 0.85rem; }
      .stat-item { padding: 0.35rem 0.7rem; min-width: 52px; }
      .stat-value { font-size: 1rem; }
      .bomb { font-size: 6rem; }
      .check-mark { font-size: 9rem; }
      .btn-start { padding: 0.85rem 2rem; font-size: 1rem; }
      .start-overlay .start-icon { font-size: 2.8rem; }
    }

    @media (max-width: 400px) {
      .card { font-size: 0.8rem; border-radius: 0.65rem; }
      .card.card-en { font-size: 0.85rem; }
      .card.card-cn { font-size: 0.72rem; }
      .game-board { gap: 0.3rem; }
      .timer-value { font-size: 1.1rem; }
      .check-mark { font-size: 7rem; }
    }
  </style>
</head>
<body>

<div class="app-card" id="appCard">
  <!-- 顶部 -->
  <div class="top-bar">
    <div class="timer-box" id="timerBox">
      <span class="timer-icon">⏱️</span>
      <div>
        <div class="timer-value" id="timerDisplay">60</div>
        <div class="timer-label">秒</div>
      </div>
    </div>
    <div class="score-box">
      <div class="stat-item">
        <span class="stat-value" id="scoreDisplay">0</span>
        <span class="stat-label">得分</span>
      </div>
      <div class="stat-item">
        <span class="stat-value" id="comboDisplay">0</span>
        <span class="stat-label">连击</span>
      </div>
      <div class="stat-item">
        <span class="stat-value" id="progressDisplay">0/8</span>
        <span class="stat-label">进度</span>
      </div>
    </div>
  </div>

  <!-- 关卡选择 -->
  <div class="level-bar" id="levelBar">
    <button class="level-btn active" data-level="easy">🌱 基础 (8对)</button>
    <button class="level-btn" data-level="medium">🔥 进阶 (10对)</button>
    <button class="level-btn" data-level="hard">💎 挑战 (12对)</button>
  </div>

  <!-- 游戏面板 + 待机遮罩 -->
  <div class="game-board grid-4" id="gameBoard" style="position: relative;">
    <!-- 待机遮罩 -->
    <div class="start-overlay" id="startOverlay">
      <div class="start-icon">🎯</div>
      <p>四级词汇消消乐<br>限时 60 秒，配对英文与中文</p>
      <button class="btn-start" id="startGameBtn">▶ 开始游戏</button>
    </div>
  </div>

  <!-- 单词提示 -->
  <div class="word-hint" id="wordHint"></div>

  <!-- 控制按钮 -->

    }
  }

  function showMessage(text, type = '') {
    messageEl.textContent = text;
    messageEl.className = 'message' + (type ? ' ' + type : '');
  }

  // ==================== 答对反馈：中等震动 + 对号 ====================
  function showCorrectFeedback() {
    appCard.classList.remove('shake-correct', 'shake-wrong');
    void appCard.offsetWidth;
    appCard.classList.add('shake-correct');
    setTimeout(() => appCard.classList.remove('shake-correct'), 600);

    checkOverlay.classList.add('show');
    setTimeout(() => checkOverlay.classList.remove('show'), 750);
  }

  // ==================== 答错反馈：超强震动 + 炸弹 ====================
  function showWrongFeedback() {
    appCard.classList.remove('shake-correct', 'shake-wrong');
    void appCard.offsetWidth;
    appCard.classList.add('shake-wrong');
    setTimeout(() => appCard.classList.remove('shake-wrong'), 900);

    bombOverlay.classList.add('show');
    setTimeout(() => bombOverlay.classList.remove('show'), 950);
  }

  // ==================== 倒计时 ====================
  function startTimer() {
    if (gameState.timerInterval) clearInterval(gameState.timerInterval);
    gameState.timeLeft = gameState.totalTime;
    updateTimerDisplay();

    gameState.timerInterval = setInterval(() => {
      if (gameState.gameOver || !gameState.isPlaying) return;
      gameState.timeLeft--;
      updateTimerDisplay();

      if (gameState.timeLeft <= 0) {
        clearInterval(gameState.timerInterval);
        gameState.timerInterval = null;
        gameState.gameOver = true;
        gameState.isPlaying = false;
        showTimeUp();
      }
    }, 1000);
  }

  function stopTimer() {
    if (gameState.timerInterval) {
      clearInterval(gameState.timerInterval);
      gameState.timerInterval = null;
    }
  }

  // ==================== 时间到 ====================
  function showTimeUp() {
    stopTimer();
    gameState.locked = true;
    const elapsed = gameState.totalTime;

    appCard.classList.remove('shake-correct', 'shake-wrong');
    void appCard.offsetWidth;
    appCard.classList.add('shake-wrong');
    setTimeout(() => appCard.classList.remove('shake-wrong'), 900);

    setTimeout(() => {
      modalBox.className = 'modal fail';
      modalIcon.textContent = '⏰';
      modalTitle.textContent = '时间到！';
      modalSubtitle.textContent = `你在规定时间内未完成所有配对，还剩 ${gameState.totalPairs - gameState.matchedPairs} 对未完成`;
      modalScore.textContent = gameState.score;
      modalTime.textContent = `${elapsed}秒`;
      modalOverlay.classList.add('show');
    }, 600);
  }

  // ==================== 挑战成功 ====================
  function showSuccess() {
    stopTimer();
    gameState.gameOver = true;
    gameState.isPlaying = false;
    const elapsed = gameState.totalTime - gameState.timeLeft;
    const timeBonus = gameState.timeLeft * 5;
    const finalScore = gameState.score + timeBonus;
    gameState.score = finalScore;
    updateStats();

    modalBox.className = 'modal success';
    modalIcon.textContent = '🏆';
    modalTitle.textContent = '挑战成功！';
    modalSubtitle.textContent = `你在 ${elapsed} 秒内完成了所有配对，剩余时间奖励 +${timeBonus} 分`;
    modalScore.textContent = finalScore;
    modalTime.textContent = `${elapsed}秒`;
    modalOverlay.classList.add('show');
  }

  // ==================== 生成牌面 ====================
  function setupBoard(level) {
    gameState.level = level;
    const config = levelConfig[level];
    gameState.totalPairs = config.pairs;
    gameState.matchedPairs = 0;
    gameState.score = 0;
    gameState.combo = 0;
    gameState.maxCombo = 0;
    gameState.selectedCard = null;
    gameState.locked = false;
    gameState.gameOver = false;
    gameState.hintsUsed = 0;
    gameState.totalTime = config.time;
    gameState.timeLeft = config.time;
    gameState.isPlaying = false;

    stopTimer();

    const uniqueWords = [];
    const usedWords = new Set();
    const shuffledBank = shuffleArray(wordBank);

    for (const w of shuffledBank) {
      if (!usedWords.has(w.word) && uniqueWords.length < config.pairs) {
        usedWords.add(w.word);
        uniqueWords.push(w);
      }
    }

    gameState.cards = [];
    let cardId = 0;
    uniqueWords.forEach((w, pairId) => {
      gameState.cards.push({
        id: cardId++,
        type: 'en',
        word: w.word,
        definition: w.definition,
        pairId: pairId,
        matched: false
      });
      gameState.cards.push({
        id: cardId++,
        type: 'cn',
        word: w.word,
        definition: w.definition,
        pairId: pairId,
        matched: false
      });
    });

    gameState.cards = shuffleArray(gameState.cards);

    gameBoard.className = 'game-board grid-' + config.cols;
    renderBoard();
    updateStats();
    updateTimerDisplay();
    wordHint.textContent = `本局单词：${uniqueWords.map(w => w.word).join(' · ')}`;

    document.querySelectorAll('.level-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.level === level);
    });
  }

  // ==================== 开始游戏 ====================
  function startGame() {
    startOverlay.classList.add('hidden');
    newGameBtn.disabled = false;
    hintBtn.disabled = false;
    gameState.isPlaying = true;
    gameState.gameOver = false;
    startTimer();
    showMessage('⏱️ 限时 60 秒！点击英文单词，再点击对应的中文释义进行配对');
  }

  // ==================== 初始化 ====================
  function initGame(level = gameState.level) {
    setupBoard(level);
    startOverlay.classList.remove('hidden');
    newGameBtn.disabled = true;
    hintBtn.disabled = true;
    modalOverlay.classList.remove('show');
    showMessage('点击“开始游戏”后，倒计时才会启动');
  }

  // ==================== 渲染 ====================
  function renderBoard() {
    const existingCards = gameBoard.querySelectorAll('.card');
    existingCards.forEach(c => c.remove());

    gameState.cards.forEach(card => {
      const el = document.createElement('div');
      el.className = 'card ' + (card.type === 'en' ? 'card-en' : 'card-cn');
      if (card.matched) el.classList.add('matched');
      el.dataset.id = card.id;
      el.textContent = card.type === 'en' ? card.word : card.definition;

      if (!card.matched) {
        el.addEventListener('click', () => handleCardClick(card));
      }
      gameBoard.appendChild(el);
    });
  }

  // ==================== 点击处理 ====================
  function handleCardClick(card) {
    if (gameState.locked || gameState.gameOver || !gameState.isPlaying) return;
    if (card.matched) return;

    const el = document.querySelector(`.card[data-id="${card.id}"]`);

    if (gameState.selectedCard && gameState.selectedCard.id === card.id) {
      el.classList.remove('selected');
      gameState.selectedCard = null;
      showMessage('已取消选中');
      return;
    }

    if (!gameState.selectedCard) {
      gameState.selectedCard = card;
      el.classList.add('selected');
      showMessage(card.type === 'en' ? `已选中: ${card.word} — 请点击对应的中文` : `已选中: ${card.definition} — 请点击对应的英文`);
      return;
    }

    const firstCard = gameState.selectedCard;
    const firstEl = document.querySelector(`.card[data-id="${firstCard.id}"]`);

    if (firstCard.type === card.type) {
      firstEl.classList.remove('selected');
      gameState.selectedCard = card;
      el.classList.add('selected');
      showMessage(card.type === 'en' ? `已选中: ${card.word} — 请点击对应的中文` : `已选中: ${card.definition} — 请点击对应的英文`);
      return;
    }

    const isMatch = firstCard.pairId === card.pairId;

    if (isMatch) {
      gameState.locked = true;
      firstEl.classList.remove('selected');
      firstEl.classList.add('matched');
      el.classList.add('matched');
      firstCard.matched = true;
      card.matched = true;

      gameState.combo++;
      if (gameState.combo > gameState.maxCombo) gameState.maxCombo = gameState.combo;
      const baseScore = 15;
      const comboBonus = (gameState.combo - 1) * 8;
      const points = baseScore + comboBonus;
      gameState.score += points;
      gameState.matchedPairs++;

      updateStats();
      showMessage(`✅ 配对成功！+${points} 分${gameState.combo > 1 ? ` (连击 ×${gameState.combo})` : ''}`, 'success');

      showCorrectFeedback();

      gameState.selectedCard = null;

      if (gameState.matchedPairs === gameState.totalPairs) {
        setTimeout(() => showSuccess(), 700);
      } else {
        setTimeout(() => { gameState.locked = false; }, 700);
      }
    } else {
      gameState.locked = true;
      gameState.combo = 0;
      updateStats();

      firstEl.classList.remove('selected');
      firstEl.classList.add('wrong');
      el.classList.add('wrong');

      showWrongFeedback();

      showMessage(`💣 配对错误！炸弹来袭，连击重置`, 'error');

      setTimeout(() => {
        firstEl.classList.remove('wrong');
        el.classList.remove('wrong');
        gameState.selectedCard = null;
        gameState.locked = false;
      }, 1000);
    }
  }

  // ==================== 提示功能 ====================
  function showHint() {
    if (gameState.locked || gameState.gameOver || !gameState.isPlaying) return;
    const unmatched = gameState.cards.filter(c => !c.matched);
    if (unmatched.length === 0) return;

    const pairIds = [...new Set(unmatched.map(c => c.pairId))];
    const targetPairId = pairIds[Math.floor(Math.random() * pairIds.length)];
    const pairCards = unmatched.filter(c => c.pairId === targetPairId);

    pairCards.forEach(card => {
      const el = document.querySelector(`.card[data-id="${card.id}"]`);
      if (el) {
        el.classList.add('selected');
        setTimeout(() => el.classList.remove('selected'), 800);
      }
    });

    gameState.hintsUsed++;
    gameState.score = Math.max(0, gameState.score - 8);
    updateStats();
    showMessage(`💡 提示：已高亮一对单词 (-8分)`, '');
  }

  // ==================== 事件绑定 ====================
  startGameBtn.addEventListener('click', startGame);

  newGameBtn.addEventListener('click', () => {
    if (gameState.isPlaying) {
      initGame(gameState.level);
      startGame();
    }
  });

  playAgainBtn.addEventListener('click', () => {
    initGame(gameState.level);
    startGame();
  });

  hintBtn.addEventListener('click', showHint);

  levelBar.addEventListener('click', (e) => {
    const btn = e.target.closest('.level-btn');
    if (!btn) return;
    initGame(btn.dataset.level);
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'h' || e.key === 'H') showHint();
    if (e.key === 'n' || e.key === 'N') {
      if (gameState.isPlaying) {
        initGame(gameState.level);
        startGame();
      }
    }
  });

  // ==================== 启动 ====================
  initGame('easy');
</script>
</body>
</html>
